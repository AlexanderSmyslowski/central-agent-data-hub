name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent_hub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Syntax check scripts
        run: bash -n scripts/*.sh

      - name: Compile Python
        run: python -m compileall agent_hub

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:ci-password@localhost:55432/agent_hub
        run: pytest -q

  fresh-clone-public-demo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run documented public demo path
        env:
          AGENT_HUB_DOCKER_TIMEOUT_SECONDS: "30"
          AGENT_HUB_DB_START_TIMEOUT_SECONDS: "90"
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          cp .env.example .env
          scripts/db_start_public_demo.sh
          scripts/db_doctor.sh --public-demo
          scripts/smoke_public_demo.sh

  upgrade-drill:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run baseline-to-head upgrade drill
        env:
          AGENT_HUB_DOCKER_TIMEOUT_SECONDS: "30"
          AGENT_HUB_DB_START_TIMEOUT_SECONDS: "90"
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          cp .env.example .env
          scripts/upgrade_drill.sh

  trust-loop-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run multi-agent trust-loop smoke
        env:
          AGENT_HUB_DOCKER_TIMEOUT_SECONDS: "30"
          AGENT_HUB_DB_START_TIMEOUT_SECONDS: "90"
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          cp .env.example .env
          scripts/smoke_trust_loop.sh

  agent-offline-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run agent offline-behavior smoke
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          cp .env.example .env
          scripts/smoke_agent_offline.sh

  external-developer-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run first external-developer project smoke
        env:
          AGENT_HUB_DOCKER_TIMEOUT_SECONDS: "30"
          AGENT_HUB_DB_START_TIMEOUT_SECONDS: "90"
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          cp .env.example .env
          scripts/smoke_external_developer.sh
