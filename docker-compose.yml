services:
  postgres:
    image: postgres:16
    container_name: ${AGENT_HUB_DB_CONTAINER:-central-agent-data-hub-postgres}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGENT_HUB_DB_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${AGENT_HUB_DB_NAME:-agent_hub}
      POSTGRES_USER: ${AGENT_HUB_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - agent-hub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  agent-hub-pgdata:
    name: ${AGENT_HUB_DB_VOLUME:-central-agent-data-hub-pgdata}
