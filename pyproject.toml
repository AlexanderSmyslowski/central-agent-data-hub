[project]
name = "central-agent-data-hub"
version = "0.1.8"
description = "Verified project memory for agentic work."
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "psycopg[binary]>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
mcp = [
  "mcp>=1.27.2",
]

[project.scripts]
agent-hub = "agent_hub.cli:main"
agent-hub-export-obsidian = "agent_hub.export_obsidian:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_hub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
