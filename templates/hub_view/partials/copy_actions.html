<script>
  (function () {
    function markCopied(button) {
      var original = button.getAttribute("data-copy-label") || button.textContent;
      var copied = document.body.getAttribute("data-copied-label") || "Copied";
      button.setAttribute("data-copy-label", original);
      button.textContent = copied;
      window.setTimeout(function () {
        button.textContent = original;
      }, 1200);
    }

    function fallbackCopy(text, button) {
      var area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "absolute";
      area.style.left = "-9999px";
      document.body.appendChild(area);
      area.select();
      try {
        document.execCommand("copy");
        markCopied(button);
      } finally {
        document.body.removeChild(area);
      }
    }

    document.addEventListener("click", function (event) {
      var button = event.target.closest("[data-copy-target]");
      if (!button) {
        return;
      }
      var target = document.getElementById(button.getAttribute("data-copy-target"));
      if (!target) {
        return;
      }
      var text = target.value || target.textContent || "";
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () {
          markCopied(button);
        }).catch(function () {
          fallbackCopy(text, button);
        });
      } else {
        fallbackCopy(text, button);
      }
    });

    var reviewSearchAliases = {
      risiko: ["risk", "risks", "risiken"],
      risiken: ["risk", "risks", "risiko"],
      frage: ["question", "questions", "open question", "offene fragen"],
      fragen: ["question", "questions", "open question", "offene fragen"],
      entscheidung: ["decision", "decisions"],
      entscheidungen: ["decision", "decisions"],
      fakt: ["fact", "facts", "fakten"],
      fakten: ["fact", "facts", "fakt"],
      bericht: ["report", "reports", "status", "stand"],
      berichte: ["report", "reports", "status", "stand"],
      stand: ["status", "latest status", "report", "bericht"],
      arbeitsstand: ["status", "latest status", "report", "bericht"],
      beziehung: ["relation", "relations", "beziehungen"],
      beziehungen: ["relation", "relations", "beziehung"],
      quelle: ["source", "sources"],
      quellen: ["source", "sources"],
      pruefung: ["review", "reviewed", "draft", "drafts"],
      prüfung: ["review", "reviewed", "draft", "drafts"],
      zuständig: ["reviewer", "owner"],
      zustaendig: ["reviewer", "owner"]
    };

    function searchTerms(query) {
      var terms = [query];
      query.split(/\s+/).forEach(function (word) {
        if (reviewSearchAliases[word]) {
          terms = terms.concat(reviewSearchAliases[word]);
        }
      });
      if (reviewSearchAliases[query]) {
        terms = terms.concat(reviewSearchAliases[query]);
      }
      return terms.filter(function (term, index) {
        return term && terms.indexOf(term) === index;
      });
    }

    function fillTemplate(template, count, query) {
      return template
        .replace(/__count__/g, String(count))
        .replace(/__query__/g, query || "");
    }

    var memoryExplorer = document.querySelector("[data-memory-explorer]");
    if (memoryExplorer) {
      var filter = memoryExplorer.querySelector("[data-memory-filter]");
      var result = memoryExplorer.querySelector("[data-memory-results]");
      var empty = memoryExplorer.querySelector("[data-memory-empty]");
      var hits = memoryExplorer.querySelector("[data-memory-hits]");
      var clear = memoryExplorer.querySelector("[data-memory-clear]");
      var firstAction = memoryExplorer.querySelector("[data-memory-first]");
      var items = Array.prototype.slice.call(document.querySelectorAll("[data-memory-item]"));
      var showingTemplate = memoryExplorer.getAttribute("data-showing-template") || "Showing __count__ visible memory items on this page.";
      var resultTemplate = memoryExplorer.getAttribute("data-result-template") || '__count__ matches for "__query__".';
      var firstTemplate = memoryExplorer.getAttribute("data-first-template") || 'Open first match for "__query__".';
      var currentMatches = [];

      items.forEach(function (item, index) {
        if (!item.id) {
          item.id = "memory-item-" + (index + 1);
        }
      });

      function itemLabel(item) {
        var title = item.querySelector(".item-title");
        var text = (title ? title.textContent : item.textContent || "").trim();
        return text.replace(/\s+/g, " ").slice(0, 140);
      }

      function itemHaystack(item) {
        var type = item.getAttribute("data-memory-type") || "";
        return (type + " " + (item.textContent || "")).toLowerCase();
      }

      function renderHits(matches, query) {
        if (!hits) {
          return;
        }
        while (hits.firstChild) {
          hits.removeChild(hits.firstChild);
        }
        hits.hidden = !query || matches.length === 0;
        if (!query || matches.length === 0) {
          return;
        }
        matches.slice(0, 6).forEach(function (item) {
          var link = document.createElement("a");
          var strong = document.createElement("strong");
          var span = document.createElement("span");
          var type = item.getAttribute("data-memory-label") || item.getAttribute("data-memory-type") || "memory";

          link.className = "memory-filter-hit";
          link.href = "#" + item.id;
          strong.textContent = type.charAt(0).toUpperCase() + type.slice(1);
          span.textContent = itemLabel(item);
          link.appendChild(strong);
          link.appendChild(span);
          hits.appendChild(link);
        });
      }

      function openFirstMemoryMatch() {
        if (!currentMatches.length) {
          return;
        }
        var item = currentMatches[0];
        window.location.hash = item.id;
        item.scrollIntoView({ block: "start", behavior: "smooth" });
        var target = item.querySelector("a, button, [tabindex]");
        if (target && target.focus) {
          target.focus({ preventScroll: true });
        }
      }

      function updateMemoryFilter() {
        var query = (filter.value || "").trim().toLowerCase();
        var terms = searchTerms(query);
        var visible = 0;
        var matches = [];

        items.forEach(function (item) {
          var haystack = itemHaystack(item);
          var isMatch = !query || terms.some(function (term) {
            return haystack.indexOf(term) !== -1;
          });
          item.hidden = !isMatch;
          item.classList.toggle("memory-filter-match", Boolean(query && isMatch));
          if (isMatch) {
            visible += 1;
            if (query) {
              matches.push(item);
            }
          }
        });

        if (result) {
          if (query) {
            result.textContent = fillTemplate(resultTemplate, visible, filter.value.trim());
          } else {
            result.textContent = fillTemplate(showingTemplate, visible, "");
          }
        }
        currentMatches = matches;
        memoryExplorer.classList.toggle("search-active", Boolean(query));
        renderHits(matches, query);
        if (empty) {
          empty.hidden = visible !== 0;
        }
        if (clear) {
          clear.hidden = !query;
        }
        if (firstAction) {
          firstAction.hidden = !query || matches.length === 0;
          firstAction.href = matches.length ? "#" + matches[0].id : "#memory-explorer";
          firstAction.textContent = query
            ? fillTemplate(firstTemplate, matches.length, filter.value.trim())
            : "";
        }
      }

      if (filter) {
        filter.addEventListener("input", updateMemoryFilter);
        filter.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            openFirstMemoryMatch();
            filter.blur();
          }
        });
        if (firstAction) {
          firstAction.addEventListener("click", function (event) {
            event.preventDefault();
            openFirstMemoryMatch();
          });
        }
        if (clear) {
          clear.addEventListener("click", function () {
            filter.value = "";
            updateMemoryFilter();
            filter.blur();
          });
        }
        updateMemoryFilter();
      }
    }

    var inboxFilter = document.querySelector("[data-inbox-filter]");
    if (inboxFilter) {
      var inboxInput = inboxFilter.querySelector("[data-inbox-filter-input]");
      var inboxResult = inboxFilter.querySelector("[data-inbox-filter-result]");
      var inboxEmpty = inboxFilter.querySelector("[data-inbox-empty]");
      var inboxClear = inboxFilter.querySelector("[data-inbox-clear]");
      var inboxItems = Array.prototype.slice.call(document.querySelectorAll("[data-inbox-item]"));
      var inboxGroups = Array.prototype.slice.call(document.querySelectorAll("[data-inbox-group]"));
      var inboxShowingTemplate = inboxFilter.getAttribute("data-showing-template") || "Visible review items: __count__.";
      var inboxResultTemplate = inboxFilter.getAttribute("data-result-template") || 'Matches for "__query__": __count__.';

      function inboxHaystack(item) {
        return [
          item.getAttribute("data-inbox-type") || "",
          item.getAttribute("data-inbox-label") || "",
          item.getAttribute("data-inbox-project") || "",
          item.textContent || ""
        ].join(" ").toLowerCase();
      }

      function updateInboxFilter() {
        var query = (inboxInput.value || "").trim().toLowerCase();
        var terms = searchTerms(query);
        var visible = 0;

        inboxItems.forEach(function (item) {
          var haystack = inboxHaystack(item);
          var isMatch = !query || terms.some(function (term) {
            return haystack.indexOf(term) !== -1;
          });
          item.hidden = !isMatch;
          if (isMatch) {
            visible += 1;
          }
        });

        inboxGroups.forEach(function (group) {
          var visibleInGroup = Array.prototype.slice.call(group.querySelectorAll("[data-inbox-item]")).some(function (item) {
            return !item.hidden;
          });
          group.hidden = !visibleInGroup;
        });

        if (inboxResult) {
          inboxResult.textContent = query
            ? fillTemplate(inboxResultTemplate, visible, inboxInput.value.trim())
            : fillTemplate(inboxShowingTemplate, visible, "");
        }
        if (inboxEmpty) {
          inboxEmpty.hidden = visible !== 0;
        }
        if (inboxClear) {
          inboxClear.hidden = !query;
        }
      }

      if (inboxInput) {
        inboxInput.addEventListener("input", updateInboxFilter);
        inboxInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            inboxInput.blur();
          }
        });
        if (inboxClear) {
          inboxClear.addEventListener("click", function () {
            inboxInput.value = "";
            updateInboxFilter();
            inboxInput.blur();
          });
        }
        updateInboxFilter();
      }
    }

    var connectionChecklist = document.querySelector("[data-connection-checklist]");
    if (connectionChecklist) {
      var connectionChecks = Array.prototype.slice.call(connectionChecklist.querySelectorAll("[data-connection-check]"));
      var connectionSummary = connectionChecklist.querySelector("[data-connection-summary]");
      var summaryTemplate = connectionChecklist.getAttribute("data-summary-template") || "Manual checks completed: __done__ of __total__.";
      var openLabel = connectionChecklist.getAttribute("data-open-label") || "Still open";
      var readyLabel = connectionChecklist.getAttribute("data-ready-label") || "Looks ready";

      function fillCheckTemplate(template, done, total) {
        return template
          .replace(/__done__/g, String(done))
          .replace(/__total__/g, String(total));
      }

      function updateConnectionChecklist() {
        var done = connectionChecks.filter(function (item) {
          return item.checked;
        }).length;
        if (connectionSummary) {
          connectionSummary.textContent = fillCheckTemplate(summaryTemplate, done, connectionChecks.length);
        }
        Array.prototype.slice.call(connectionChecklist.querySelectorAll("[data-connection-check-card]")).forEach(function (card) {
          var cardChecks = Array.prototype.slice.call(card.querySelectorAll("[data-connection-check]"));
          var cardDone = cardChecks.length > 0 && cardChecks.every(function (item) {
            return item.checked;
          });
          var cardState = card.querySelector("[data-check-card-state]");
          card.classList.toggle("done", cardDone);
          if (cardState) {
            cardState.textContent = cardDone ? readyLabel : openLabel;
          }
        });
      }

      connectionChecks.forEach(function (item) {
        item.addEventListener("change", updateConnectionChecklist);
      });
      updateConnectionChecklist();
    }
  }());
</script>
